name: Refresh IPO data

on:
  schedule:
    # Every 20 minutes. GitHub may delay this slightly under load -- that's fine,
    # IPO odds don't need to be second-fresh. Adjust the cron if you want less
    # frequent (kinder to chittorgarh.com) or more frequent (fresher numbers).
    - cron: "*/20 * * * *"
  workflow_dispatch: {}  # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pandas lxml

      - name: Run scraper
        run: python scripts/scrape.py

      - name: Commit updated data if changed
        run: |
          git config user.name "ipo-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ipos.json
          git diff --cached --quiet && echo "No changes to commit." || \
            git commit -m "Refresh IPO data [skip ci]"
          git push
